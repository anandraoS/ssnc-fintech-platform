# Alert rules. Thresholds are ILLUSTRATIVE starting points - tune them against measured baselines (docs/operations/slo.md).
# Metric names are the Prometheus forms of the Micrometer meters defined in PlatformMetrics / Spring Boot.
groups:
  - name: platform-availability
    rules:
      - alert: PlatformServiceDown
        expr: up{job="platform-service"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: platform-service is not being scraped
          runbook: docs/operations/runbooks.md#platform-down

      - alert: HighServerErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="platform-service",status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count{job="platform-service"}[5m])) > 0.05
        for: 5m
        labels: { severity: page }
        annotations:
          summary: more than 5 % of API requests fail with 5xx
          runbook: docs/operations/runbooks.md#elevated-5xx

      - alert: HighApiLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="platform-service",uri!~"/actuator.*"}[5m]))) > 1
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: API p95 latency above 1 s for 10 minutes
          runbook: docs/operations/runbooks.md#slow-api

  - name: transaction-processing
    rules:
      - alert: ReconciliationBacklog
        expr: platform_reconciliation_open > 0
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: transactions with an unknown external outcome have been open for 15 minutes
          runbook: docs/operations/runbooks.md#reconciliation-backlog

      - alert: OutboxDeadLetters
        expr: platform_outbox_dead > 0
        for: 1m
        labels: { severity: page }
        annotations:
          summary: outbox events were dead-lettered (transactions are not being processed)
          runbook: docs/operations/runbooks.md#dead-letter-outbox-events

      - alert: OutboxBacklogGrowing
        expr: platform_outbox_backlog > 100
        for: 5m
        labels: { severity: page }
        annotations:
          summary: more than 100 validated transactions are waiting to be processed
          runbook: docs/operations/runbooks.md#outbox-backlog

      - alert: HighTransactionFailureRate
        expr: |
          sum(rate(platform_transactions_finished_total{status="FAILED"}[10m]))
            / clamp_min(sum(rate(platform_transactions_finished_total[10m])), 0.001) > 0.10
        for: 10m
        labels: { severity: page }
        annotations:
          summary: more than 10 % of finished transactions FAILED
          runbook: docs/operations/runbooks.md#transaction-failures

      - alert: ClearingCircuitOpen
        expr: platform_clearing_circuit_open == 1
        for: 1m
        labels: { severity: page }
        annotations:
          summary: the circuit breaker towards the clearing network is open
          runbook: docs/operations/runbooks.md#clearing-network-outage

  - name: capacity
    rules:
      - alert: ConnectionPoolSaturated
        expr: hikaricp_connections_pending{job="platform-service"} > 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: threads are waiting for a database connection
          runbook: docs/operations/runbooks.md#connection-pool-exhaustion

      - alert: JvmHeapHigh
        expr: |
          sum(jvm_memory_used_bytes{area="heap",job="platform-service"})
            / sum(jvm_memory_max_bytes{area="heap",job="platform-service"}) > 0.85
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: JVM heap above 85 % for 10 minutes
          runbook: docs/operations/runbooks.md#high-memory

      - alert: LongGcPauses
        expr: rate(jvm_gc_pause_seconds_sum{job="platform-service"}[5m]) > 0.1
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: more than 10 % of wall time spent in GC pauses
          runbook: docs/operations/runbooks.md#excessive-gc
