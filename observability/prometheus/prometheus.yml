# Prometheus scrape configuration for the local compose stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: platform-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["platform-service:9090"]       # management port (not published to the host)
        labels: { service: platform-service }
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
