# nginx for the SPA: security headers, SPA fallback, and a same-origin reverse proxy to the API (no CORS needed).
# The API upstream is injected by name: "platform-service" resolves through Docker/Kubernetes DNS.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Angular needs inline styles for Material; scripts are same-origin only. Tighten with nonces if you add a CDN.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }

    location /api/ {
        proxy_pass http://platform-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }

    # hashed bundles can be cached forever; index.html must always be revalidated
    location ~* \.(?:js|css|svg|ico|woff2?)$ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
