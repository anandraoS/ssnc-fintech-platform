# Local stack: PostgreSQL + platform-service + clearing-simulator + Angular (nginx) + observability.
#
#   cp .env.example .env        # then edit the CHANGE_ME values (they are required - compose refuses to start without them)
#   docker compose -f infrastructure/docker-compose.yml --env-file .env up --build
#
#   UI .............. http://localhost:4280          API ......... http://localhost:18480/swagger-ui.html
#   React UI ........ http://localhost:4281          (optional: add --profile react)
#   Grafana ......... http://localhost:3000          Prometheus .. http://localhost:9091     Jaeger ... http://localhost:16686
#
# LOCAL DEVELOPMENT ONLY: runs the platform with the "local" profile (local token issuer + synthetic seed data) against a
# real PostgreSQL so Flyway's PostgreSQL migration (partial indexes, append-only audit trigger) is exercised.
# Nothing here has been run by the author of this repository - Docker was not available when it was written; it is
# statically validated only (see docs/validation/validation-report.md).

name: investment-platform

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 20
    # no published port: only containers on this network can reach the database
    networks: [backend]
    restart: unless-stopped

  clearing-simulator:
    build:
      context: ..
      dockerfile: infrastructure/docker/clearing-simulator.Dockerfile
    networks: [backend]
    ports:
      - "127.0.0.1:18490:8080"     # chaos switch reachable from the host only
    restart: unless-stopped

  platform-service:
    build:
      context: ..
      dockerfile: infrastructure/docker/platform-service.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      clearing-simulator:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: local,postgres
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "9090"
      DB_URL: jdbc:postgresql://postgres:5432/platform
      DB_USER: platform
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DB_POOL_MAX: "20"
      CLEARING_URL: http://clearing-simulator:8080
      LOCAL_DEMO_PASSWORD: ${LOCAL_DEMO_PASSWORD:?set LOCAL_DEMO_PASSWORD in .env}
      LOCAL_ISSUER_HMAC_SECRET: ${LOCAL_ISSUER_HMAC_SECRET:?set LOCAL_ISSUER_HMAC_SECRET (>= 32 bytes) in .env}
      CORS_ALLOWED_ORIGINS: http://localhost:4280
      LOG_STRUCTURED_FORMAT: ecs
      TRACING_SAMPLING: "1.0"
      OTLP_EXPORT_ENABLED: "true"
      OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "18480:8080"
    networks: [backend, frontend, observability]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 40s
    stop_grace_period: 30s          # > spring.lifecycle.timeout-per-shutdown-phase (20 s)
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]


  frontend:
    build:
      context: ..
      dockerfile: infrastructure/docker/frontend.Dockerfile
    depends_on: [platform-service]
    ports:
      - "4280:8080"
    networks: [frontend]
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  backend: {}
  frontend: {}
  observability: {}

volumes:
  pgdata: {}
