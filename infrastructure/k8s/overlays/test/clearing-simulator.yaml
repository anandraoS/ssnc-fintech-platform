apiVersion: apps/v1
kind: Deployment
metadata:
  name: clearing-simulator
  labels: { app.kubernetes.io/name: clearing-simulator, app.kubernetes.io/part-of: investment-platform }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: clearing-simulator }
  template:
    metadata:
      labels: { app.kubernetes.io/name: clearing-simulator, app.kubernetes.io/part-of: investment-platform }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: clearing-simulator
          image: ghcr.io/example-org/investment-platform/clearing-simulator:1.0.0
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: clearing-simulator
spec:
  selector: { app.kubernetes.io/name: clearing-simulator }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clearing-simulator
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: clearing-simulator }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: platform-service }
      ports: [{ port: 8080 }]
