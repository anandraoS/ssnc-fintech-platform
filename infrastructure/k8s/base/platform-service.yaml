# platform-service: Deployment, Service, HPA, PodDisruptionBudget.
# Secrets are NEVER in this repository: the Deployment only references the Secret "platform-db-credentials" which is
# materialised by External Secrets / the CSI secrets-store driver from AWS Secrets Manager or Vault (see external-secret.example.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-service
  labels: { app.kubernetes.io/name: platform-service, app.kubernetes.io/part-of: investment-platform }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-service
  labels: { app.kubernetes.io/name: platform-service, app.kubernetes.io/part-of: investment-platform }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  # zero-downtime rolling update: never remove a ready pod before its replacement is ready
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: platform-service }
  template:
    metadata:
      labels: { app.kubernetes.io/name: platform-service, app.kubernetes.io/part-of: investment-platform }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: platform-service
      automountServiceAccountToken: false
      # graceful shutdown: preStop gives the load balancer time to stop sending traffic, then SIGTERM lets Spring drain
      # in-flight requests (20 s) - total must stay below terminationGracePeriodSeconds
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: platform-service }
      containers:
        - name: platform-service
          image: ghcr.io/example-org/investment-platform/platform-service:1.0.0   # replaced by kustomize images: in overlays/CI
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9090 }
          envFrom:
            - configMapRef: { name: platform-config }
          env:
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: platform-db-credentials, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-db-credentials, key: password } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }          # memory limit only: CPU limits cause throttling latency spikes in JVMs
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 5
            failureThreshold: 36                # up to 3 minutes for Flyway + warm-up
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 10"] }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: platform-service
  labels: { app.kubernetes.io/name: platform-service }
spec:
  selector: { app.kubernetes.io/name: platform-service }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: management, port: 9090, targetPort: management }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: platform-service
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: platform-service }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300           # avoid flapping; connections drain on scale-in
      policies: [{ type: Pods, value: 1, periodSeconds: 60 }]
    scaleUp:
      stabilizationWindowSeconds: 30
      policies: [{ type: Pods, value: 2, periodSeconds: 60 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform-service
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: platform-service }
