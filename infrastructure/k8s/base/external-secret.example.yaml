# EXAMPLE ONLY (not part of kustomization.yaml): how the database credentials reach the cluster without ever being committed.
# Requires the External Secrets Operator and a SecretStore pointing at AWS Secrets Manager (IRSA-authenticated) or Vault.
# The remote secret "investment-platform/prod/db" holds {"username": "...", "password": "..."} and is rotated there.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: platform-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef: { key: investment-platform/prod/db, property: username }
    - secretKey: password
      remoteRef: { key: investment-platform/prod/db, property: password }
